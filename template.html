<meta charset="utf-8">
<style>
  :root {
    --paper: #f6e5ba;
    --paper-2: #e8cf96;
    --ink: #241b13;
    --ink-soft: #5e4931;
    --accent: #7eaa72;
    --accent-soft: #324b37;
    --gold: #e9bd66;
    --brick: #d76d59;
    --line: #9c713b;
    --panel: rgba(22, 24, 21, 0.95);
    --panel-2: rgba(39, 31, 23, 0.96);
    --frame: #7c4c22;
    --frame-light: #ce9250;
    --cell-size: 34px;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Avenir Next", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #f6e5ba;
      --paper-2: #e8cf96;
      --ink: #241b13;
      --ink-soft: #5e4931;
      --accent: #9bc68b;
      --accent-soft: #314a36;
      --gold: #f0c873;
      --brick: #ee8b76;
      --line: #a67b45;
      --panel: rgba(17, 20, 18, 0.96);
      --panel-2: rgba(44, 31, 20, 0.97);
      --frame: #7c4c22;
      --frame-light: #d69a53;
    }
  }
  :root[data-theme="dark"] {
    --paper: #f6e5ba;
    --paper-2: #e8cf96;
    --ink: #241b13;
    --ink-soft: #5e4931;
    --accent: #9bc68b;
    --accent-soft: #314a36;
    --gold: #f0c873;
    --brick: #ee8b76;
    --line: #a67b45;
    --panel: rgba(17, 20, 18, 0.96);
    --panel-2: rgba(44, 31, 20, 0.97);
    --frame: #7c4c22;
    --frame-light: #d69a53;
  }
  :root[data-theme="light"] {
    --paper: #f6e5ba;
    --paper-2: #e8cf96;
    --ink: #241b13;
    --ink-soft: #5e4931;
    --accent: #6d9b63;
    --accent-soft: #dce7d6;
    --gold: #bd8533;
    --brick: #b94f3c;
    --line: #9c713b;
    --panel: rgba(24, 27, 23, 0.95);
    --panel-2: rgba(52, 38, 24, 0.96);
    --frame: #75471f;
    --frame-light: #c88c48;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #101719; }
  .page {
    min-height: 100vh;
    margin: 0 auto;
    padding: 42px max(18px, calc((100vw - 780px) / 2)) 70px;
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    gap: 16px;
    background-color: #11191a;
    background-image: linear-gradient(rgba(8, 13, 13, 0.10), rgba(8, 13, 13, 0.18)), url("__BACKGROUND_IMAGE__");
    background-size: cover;
    background-position: center top;
    background-attachment: fixed;
  }
  .pet {
    flex-shrink: 0;
    width: 175px;
    height: 160px;
    pointer-events: none;
    background-image: url("__PET_SPRITES__");
    background-repeat: no-repeat;
    background-size: 450px 300px;
    filter: drop-shadow(0 7px 7px rgba(0, 0, 0, .42));
  }
  .pet-dog { background-position: -35px -70px; }
  .pet-cat { background-position: -248px -95px; }
  .masthead { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .date-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    width: 100%;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    background: var(--panel-2);
    border: 3px solid var(--frame);
    box-shadow: 0 0 0 2px #25170d, 0 5px 0 #140d09, inset 0 0 0 2px var(--frame-light);
    padding: 8px 15px 7px;
  }
  .study-topic {
    margin: -1px 0 2px;
    color: #f5d98f;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .06em;
    text-align: center;
    text-transform: uppercase;
    text-shadow: 1px 1px 0 #1e140d;
  }
  .date {
    font-family: var(--serif);
    font-size: clamp(27px, 5vw, 38px);
    font-weight: 700;
    text-wrap: balance;
    text-align: center;
    letter-spacing: 0.05em;
    color: var(--paper);
    text-shadow: 2px 2px 0 #24170e;
    background: var(--panel-2);
    border: 4px solid var(--frame);
    box-shadow: 0 0 0 2px #1e140d, 0 6px 0 #100b08, inset 0 0 0 2px var(--frame-light);
    padding: 10px 27px 12px;
    flex: 1 1 280px;
    min-width: 0;
    max-width: 580px;
  }
  .greeting {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.45;
    color: var(--ink);
    max-width: 580px;
    margin: 0;
    padding: 16px 20px;
    background: var(--paper);
    border: 3px solid #b68548;
    box-shadow: 0 0 0 3px #5f3e1f, 0 5px 0 #26170d;
  }
  .greeting b { color: var(--ink); font-weight: 600; }
  .puzzle-card {
    background: linear-gradient(135deg, rgba(35, 34, 28, 0.98), var(--panel));
    border: 4px solid var(--frame);
    box-shadow: 0 0 0 2px #1f160f, 0 0 0 5px var(--frame-light), 0 8px 0 #160e09, 0 16px 30px rgba(0,0,0,0.48), inset 0 0 40px rgba(0,0,0,0.42);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: min(100%, 760px);
    margin: 0 auto;
    position: relative;
    overflow: visible;
  }
  .grid-scroll { overflow-x: auto; padding-bottom: 4px; }
  .grid {
    display: grid;
    gap: 0;
    background: transparent;
    border: 0;
    box-shadow: 0 3px 12px rgba(0,0,0,.5);
    width: max-content;
    margin: 0 auto;
  }
  .cell {
    position: relative;
    width: var(--cell-size);
    height: var(--cell-size);
    background: #262822;
    border: 1px solid #695f50;
  }
  .cell.block { background: transparent; border: 0; }
  .cell input {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    text-align: center;
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 600;
    text-transform: uppercase;
    color: #f6e5ba;
    padding: 0;
  }
  .cell input:focus { outline: none; }
  .cell.active-cell { background: #658759; }
  .cell.active-cell input { color: #fff0c9; }
  .cell.active-word:not(.active-cell) { background: #3d553e; }
  .cell input.correct { color: #9bce8d; }
  .cell.active-cell input.correct { color: #fff0c9; }
  .cell input.incorrect { color: var(--brick); }
  .cell input.revealed { color: var(--gold); }
  .cell .num {
    position: absolute;
    top: 1px;
    left: 2px;
    font-family: var(--mono);
    font-size: 8px;
    color: #ecd69e;
    pointer-events: none;
  }
  .cell.active-cell .num { color: var(--paper); opacity: 0.85; }
  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  button.action {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .04em;
    padding: 10px 15px;
    border-radius: 0;
    border: 2px solid #92bd80;
    box-shadow: 0 3px 0 #213823, inset 0 0 0 2px #4c7544;
    background: #365a37;
    color: #fff0c9;
    cursor: pointer;
  }
  button.action.secondary {
    background: #2c312c;
    color: #f0cf89;
    border-color: #c69a55;
    box-shadow: 0 3px 0 #1a1b18, inset 0 0 0 2px #725a36;
  }
  button.action:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .feedback {
    font-family: var(--mono);
    font-size: 12px;
    color: #ecd69e;
  }
  .audio-controls {
    width: 100%;
    border: 2px solid #725a36;
    background: rgba(14, 19, 16, .74);
    color: #f4dfaf;
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 10px;
  }
  .audio-controls summary { cursor: pointer; color: var(--gold); font-weight: 800; }
  .audio-control-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .audio-control-row label { min-width: 88px; }
  .audio-control-row input[type="range"] { accent-color: var(--accent); width: min(180px, 100%); }
  .clues {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: min(100%, 760px);
    margin: 8px auto 0;
  }
  @media (max-width: 700px) {
    .date-row { flex-direction: column; gap: 10px; }
    .date { max-width: 100%; }
  }
  @media (max-width: 480px) {
    .clues { grid-template-columns: 1fr; }
    :root { --cell-size: 28px; }
    .cell input { font-size: 14px; }
    .date-row { gap: 6px; }
    .pet { width: 90px; height: 82px; background-size: 232px 155px; opacity: .96; }
    .pet-dog { background-position: -18px -36px; }
    .pet-cat { background-position: -128px -49px; }
  }
  .clue-col h2 {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--gold);
    margin: 0 0 8px;
    border-bottom: 2px solid #8e693c;
    padding-bottom: 7px;
  }
  .clue-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .clue-item {
    font-size: 13.5px;
    line-height: 1.4;
    color: #f4dfaf;
    cursor: pointer;
    display: flex;
    gap: 6px;
  }
  .clue-item .n { font-family: var(--mono); color: var(--gold); flex-shrink: 0; }
  .clue-item.active { color: #fff4d7; font-weight: 700; }
  .clue-rationale {
    flex-basis: 100%;
    margin: 2px 0 2px 22px;
    padding: 7px 9px;
    border-left: 2px solid var(--gold);
    background: rgba(197, 148, 67, 0.12);
    color: #f8d995;
    font-size: 12px;
    line-height: 1.4;
    cursor: default;
  }
  .clue-rationale strong { color: var(--gold); }
  .clue-col { background: rgba(18, 22, 19, .92); border: 3px solid var(--frame); box-shadow: 0 0 0 2px #1e140d, inset 0 0 0 2px #b88346, 0 5px 0 #140d09; padding: 15px; }
  .signoff {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    color: #f0d9a2;
    background: rgba(18, 22, 19, .9);
    border: 2px solid var(--frame);
    box-shadow: 0 0 0 2px #1e140d, inset 0 0 0 1px var(--frame-light);
    padding: 9px 16px;
    text-align: center;
  }
  @media (prefers-reduced-motion: no-preference) {
    .cell.active-cell { transition: background 0.1s ease; }
  }
  .celebrate-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 10, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .celebrate-backdrop[hidden] { display: none; }
  .celebrate-card {
    background: var(--panel-2);
    border: 4px solid var(--frame);
    box-shadow: 0 0 0 2px #1e140d, inset 0 0 0 2px var(--frame-light), 0 12px 35px rgba(0,0,0,.55);
    border-radius: 0;
    padding: 30px 26px;
    max-width: 340px;
    max-height: 86vh;
    overflow-y: auto;
    width: 100%;
    text-align: center;
    box-shadow: 0 16px 44px rgba(0, 0, 0, 0.3);
  }
  .celebrate-attempts {
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-height: 220px;
    overflow-y: auto;
    margin: 4px 0 20px;
    padding: 10px 2px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .attempt-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    text-align: left;
  }
  .attempt-label { color: var(--accent); flex-shrink: 0; width: 22px; }
  .attempt-word { flex: 1; color: var(--ink); letter-spacing: 0.03em; }
  .attempt-count { color: var(--ink-soft); flex-shrink: 0; }
  .attempt-count.first-try { color: var(--gold); font-weight: 700; }
  @media (prefers-reduced-motion: no-preference) {
    .celebrate-card { animation: celebrate-pop 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
  }
  @keyframes celebrate-pop {
    from { transform: scale(0.88); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .celebrate-emoji { font-size: 38px; margin-bottom: 6px; }
  .celebrate-title {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 6px;
    text-wrap: balance;
  }
  .celebrate-sub {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--ink-soft);
    margin-bottom: 20px;
  }
  .completion-pearl {
    margin: 0 0 18px;
    padding: 10px;
    border-left: 2px solid var(--gold);
    background: rgba(197, 148, 67, .12);
    color: #f8d995;
    font-size: 12px;
    line-height: 1.45;
    text-align: left;
  }
  .completion-pearl strong { color: var(--gold); }
</style>

<div class="page">
  <div class="masthead">
    <div class="eyebrow">Scrubs &amp; Squares</div>
    <p class="study-topic" id="studyTopic"></p>
    <div class="date-row">
      <div class="pet pet-cat" aria-hidden="true"></div>
      <div class="date">__DATE_STR__</div>
      <div class="pet pet-dog" aria-hidden="true"></div>
    </div>
    <p class="greeting">__GREETING_HTML__</p>
  </div>

  <div class="puzzle-card">
    <div class="grid-scroll">
      <div class="grid" id="grid"></div>
    </div>
    <div class="actions">
      <button class="action" id="checkBtn">Check answers</button>
      <button class="action secondary" id="revealBtn">Reveal answers</button>
      <button class="action secondary" id="musicBtn" type="button" aria-pressed="false">Music: Off</button>
      <span class="feedback" id="feedback">Fill in the grid, then press Enter (or hit Check).</span>
    </div>
    <details class="audio-controls">
      <summary>Audio settings</summary>
      <div class="audio-control-row">
        <label><input type="checkbox" id="musicEnabled"> Background music</label>
        <input type="range" id="musicVolume" min="0" max="100" step="1" aria-label="Background music volume">
      </div>
      <div class="audio-control-row">
        <label><input type="checkbox" id="effectsEnabled"> Answer sounds</label>
        <input type="range" id="effectsVolume" min="0" max="100" step="1" aria-label="Answer sounds volume">
      </div>
    </details>
  </div>

  <div class="clues">
    <div class="clue-col">
      <h2>Across</h2>
      <ul class="clue-list" id="acrossList"></ul>
    </div>
    <div class="clue-col">
      <h2>Down</h2>
      <ul class="clue-list" id="downList"></ul>
    </div>
  </div>

  <p class="signoff">__SIGNOFF_HTML__</p>
</div>

<div class="celebrate-backdrop" id="celebrate" hidden>
  <div class="celebrate-card">
    <div class="celebrate-emoji">🎉</div>
    <div class="celebrate-title">Nice job, bae!</div>
    <div class="celebrate-sub" id="celebrateSub">You solved today's puzzle. Go get 'em at clinicals.</div>
    <div class="completion-pearl" id="completionPearl" hidden></div>
    <div class="celebrate-attempts" id="celebrateAttempts"></div>
    <button class="action" id="celebrateClose">Close</button>
  </div>
</div>

<script>
  const PUZZLE = __PUZZLE_JSON__;
  const MUSIC = __MUSIC_JSON__;
  const SFX = __SFX_JSON__;
  const INTRO_MUSIC = __INTRO_MUSIC_JSON__;

  const { width, height, cells, entries } = PUZZLE;
  const puzzleId = PUZZLE.id || [document.title, width, height, entries.map(e => e.answer).join("-")].join(":");
  const progressKey = "scrubs-squares:progress:" + puzzleId;
  const preferencesKey = "scrubs-squares:audio-preferences";
  const historyKey = "scrubs-squares:study-history";

  function readStored(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; }
    catch (_) { return fallback; }
  }
  function writeStored(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); }
    catch (_) { /* Private browsing or a full storage quota should not block play. */ }
  }
  document.getElementById("studyTopic").textContent = PUZZLE.topic ? "Today's focus: " + PUZZLE.topic : "Today's NCLEX review";

  // Map each letter cell to the across/down entries that pass through it.
  const cellEntries = {}; // "r,c" -> { across: entryIdx|null, down: entryIdx|null }
  function key(r, c) { return r + "," + c; }
  entries.forEach((e, idx) => {
    const dr = e.direction === "down" ? 1 : 0;
    const dc = e.direction === "across" ? 1 : 0;
    for (let i = 0; i < e.length; i++) {
      const r = e.row + dr * i, c = e.col + dc * i;
      const k = key(r, c);
      if (!cellEntries[k]) cellEntries[k] = { across: null, down: null };
      cellEntries[k][e.direction] = idx;
    }
  });

  const entryAttempts = entries.map(() => 0);
  const entrySolved = entries.map(() => false);
  let hasCelebrated = false;

  const savedPreferences = readStored(preferencesKey, {});
  const musicPlayer = new Audio();
  musicPlayer.preload = "auto";
  let musicVolume = Number.isFinite(savedPreferences.musicVolume) ? savedPreferences.musicVolume : 0.24;
  let effectsVolume = Number.isFinite(savedPreferences.effectsVolume) ? savedPreferences.effectsVolume : 0.55;
  let musicEnabled = savedPreferences.musicEnabled !== false;
  let effectsEnabled = savedPreferences.effectsEnabled !== false;
  musicPlayer.volume = musicVolume;
  let lastTrackIndex = -1;
  let introPlayed = false;

  const effects = Object.fromEntries(Object.entries(SFX).map(([name, sources]) => {
    const sourceList = (Array.isArray(sources) ? sources : [sources]).filter(Boolean);
    return [name, sourceList.map(src => {
      const effect = new Audio(src);
      effect.preload = "auto";
      effect.volume = effectsVolume;
      return effect;
    })];
  }));

  function chooseEffect(name) {
    const choices = effects[name] || [];
    return choices.length ? choices[Math.floor(Math.random() * choices.length)] : null;
  }

  function playEffect(name) {
    const effect = chooseEffect(name);
    if (!effect || !effectsEnabled) return;
    effect.pause();
    effect.currentTime = 0;
    effect.play().catch(() => {});
  }

  function playCompletionSounds() {
    const levelUp = chooseEffect("levelUp");
    const imReady = chooseEffect("imReady");
    const completion = chooseEffect("completion");
    if (!levelUp || !imReady || !effectsEnabled) return;
    imReady.pause();
    imReady.currentTime = 0;
    if (completion) {
      completion.pause();
      completion.currentTime = 0;
    }
    levelUp.onended = () => {
      imReady.onended = () => {
        if (completion) completion.play().catch(() => {});
      };
      imReady.play().catch(() => {});
    };
    levelUp.pause();
    levelUp.currentTime = 0;
    levelUp.play().catch(() => {});
  }

  function updateMusicButton() {
    const button = document.getElementById("musicBtn");
    button.textContent = musicEnabled ? "Music: On" : "Music: Off";
    button.setAttribute("aria-pressed", String(musicEnabled));
  }

  function saveAudioPreferences() {
    writeStored(preferencesKey, { musicEnabled, effectsEnabled, musicVolume, effectsVolume });
  }

  function updateAudioControls() {
    document.getElementById("musicEnabled").checked = musicEnabled;
    document.getElementById("effectsEnabled").checked = effectsEnabled;
    document.getElementById("musicVolume").value = Math.round(musicVolume * 100);
    document.getElementById("effectsVolume").value = Math.round(effectsVolume * 100);
    musicPlayer.volume = musicVolume;
    Object.values(effects).flat().forEach(effect => { effect.volume = effectsVolume; });
    updateMusicButton();
  }

  function chooseNextTrack() {
    if (!MUSIC.length) return;
    let nextIndex = 0;
    if (MUSIC.length > 1) {
      do { nextIndex = Math.floor(Math.random() * MUSIC.length); }
      while (nextIndex === lastTrackIndex);
    }
    lastTrackIndex = nextIndex;
    musicPlayer.src = MUSIC[nextIndex].src;
    musicPlayer.play().catch(() => {
      // Autoplay is often blocked. Keep the preference on and retry at first interaction.
    });
  }

  function playIntroMusic() {
    if (!INTRO_MUSIC || introPlayed) return;
    introPlayed = true;
    musicPlayer.src = INTRO_MUSIC.src;
    musicPlayer.play().catch(() => {
      introPlayed = false;
    });
  }

  musicPlayer.addEventListener("ended", () => {
    if (musicEnabled) chooseNextTrack();
  });

  document.getElementById("musicBtn").addEventListener("click", () => {
    musicEnabled = !musicEnabled;
    if (musicEnabled) {
      if (musicPlayer.paused && !introPlayed) playIntroMusic();
      else if (musicPlayer.paused) chooseNextTrack();
      else musicPlayer.play();
    } else {
      musicPlayer.pause();
    }
    saveAudioPreferences();
    updateAudioControls();
  });
  document.getElementById("musicEnabled").addEventListener("change", (ev) => {
    musicEnabled = ev.target.checked;
    if (musicEnabled && !introPlayed) playIntroMusic();
    else if (musicEnabled) chooseNextTrack();
    else musicPlayer.pause();
    saveAudioPreferences();
    updateAudioControls();
  });
  document.getElementById("effectsEnabled").addEventListener("change", (ev) => {
    effectsEnabled = ev.target.checked;
    saveAudioPreferences();
    updateAudioControls();
  });
  document.getElementById("musicVolume").addEventListener("input", (ev) => {
    musicVolume = Number(ev.target.value) / 100;
    saveAudioPreferences();
    updateAudioControls();
  });
  document.getElementById("effectsVolume").addEventListener("input", (ev) => {
    effectsVolume = Number(ev.target.value) / 100;
    saveAudioPreferences();
    updateAudioControls();
  });
  updateAudioControls();
  // Try straight away, then retry on the first user interaction if autoplay is blocked.
  if (musicEnabled) playIntroMusic();
  function unlockBackgroundMusic() {
    if (musicEnabled && musicPlayer.paused) {
      if (!introPlayed) playIntroMusic();
      else chooseNextTrack();
    }
  }
  document.addEventListener("pointerdown", unlockBackgroundMusic, { once: true });
  document.addEventListener("keydown", unlockBackgroundMusic, { once: true });

  const gridEl = document.getElementById("grid");
  gridEl.style.gridTemplateColumns = "repeat(" + width + ", var(--cell-size))";
  gridEl.style.gridTemplateRows = "repeat(" + height + ", var(--cell-size))";

  const inputs = {}; // "r,c" -> input element

  for (let r = 0; r < height; r++) {
    for (let c = 0; c < width; c++) {
      const letter = cells[r][c];
      const cellDiv = document.createElement("div");
      if (!letter) {
        cellDiv.className = "cell block";
        gridEl.appendChild(cellDiv);
        continue;
      }
      cellDiv.className = "cell";
      const num = PUZZLE.numbers[key(r, c)];
      if (num) {
        const numSpan = document.createElement("span");
        numSpan.className = "num";
        numSpan.textContent = num;
        cellDiv.appendChild(numSpan);
      }
      const input = document.createElement("input");
      input.maxLength = 1;
      input.autocomplete = "off";
      input.spellcheck = false;
      input.inputMode = "text";
      input.dataset.r = r;
      input.dataset.c = c;
      cellDiv.appendChild(input);
      gridEl.appendChild(cellDiv);
      inputs[key(r, c)] = input;
    }
  }

  let selected = null; // {r, c}
  let direction = "across";

  function saveProgress() {
    const letters = {};
    Object.entries(inputs).forEach(([cellKey, input]) => { letters[cellKey] = input.value; });
    writeStored(progressKey, {
      letters,
      attempts: entryAttempts,
      solved: entrySolved,
      hasCelebrated,
      savedAt: new Date().toISOString(),
    });
  }

  function recordStudyOutcome(entry, attempts) {
    const history = readStored(historyKey, {});
    const prior = history[entry.answer] || { seen: 0, tough: 0 };
    history[entry.answer] = {
      ...prior,
      clue: entry.clue,
      topic: entry.topic || PUZZLE.topic || "NCLEX Review",
      seen: prior.seen + 1,
      tough: prior.tough + (attempts > 1 ? 1 : 0),
      lastAttempts: attempts,
      lastSeen: new Date().toISOString(),
    };
    writeStored(historyKey, history);
  }

  function lockEntry(idx, shouldRevealPearl = true) {
    const entry = entries[idx];
    const dr = entry.direction === "down" ? 1 : 0;
    const dc = entry.direction === "across" ? 1 : 0;
    entrySolved[idx] = true;
    for (let i = 0; i < entry.length; i++) {
      const input = inputs[key(entry.row + dr * i, entry.col + dc * i)];
      if (!input) continue;
      input.readOnly = true;
      input.classList.add("correct");
      input.classList.remove("incorrect", "revealed");
    }
    if (shouldRevealPearl) revealRationale(entry);
  }

  function restoreProgress() {
    const saved = readStored(progressKey, null);
    if (!saved) return;
    Object.entries(saved.letters || {}).forEach(([cellKey, value]) => {
      if (inputs[cellKey]) inputs[cellKey].value = String(value || "").slice(0, 1);
    });
    (saved.attempts || []).forEach((attempts, idx) => {
      if (idx < entryAttempts.length) entryAttempts[idx] = Number(attempts) || 0;
    });
    (saved.solved || []).forEach((solved, idx) => {
      if (solved && idx < entrySolved.length) lockEntry(idx);
    });
    hasCelebrated = Boolean(saved.hasCelebrated);
    if (Object.values(saved.letters || {}).some(Boolean)) {
      document.getElementById("feedback").textContent = "Your saved progress is back. 💛";
    }
  }

  function entryFor(r, c, dir) {
    const ce = cellEntries[key(r, c)];
    if (!ce) return null;
    const idx = ce[dir];
    return idx === null || idx === undefined ? null : entries[idx];
  }

  function clearHighlights() {
    document.querySelectorAll(".cell.active-cell").forEach(el => el.classList.remove("active-cell"));
    document.querySelectorAll(".cell.active-word").forEach(el => el.classList.remove("active-word"));
    document.querySelectorAll(".clue-item.active").forEach(el => el.classList.remove("active"));
  }

  function highlight() {
    clearHighlights();
    if (!selected) return;
    const entry = entryFor(selected.r, selected.c, direction);
    if (entry) {
      const dr = entry.direction === "down" ? 1 : 0;
      const dc = entry.direction === "across" ? 1 : 0;
      for (let i = 0; i < entry.length; i++) {
        const r = entry.row + dr * i, c = entry.col + dc * i;
        const inp = inputs[key(r, c)];
        if (inp) inp.parentElement.classList.add("active-word");
      }
      const clueEl = document.querySelector(
        '.clue-item[data-dir="' + entry.direction + '"][data-num="' + entry.number + '"]'
      );
      if (clueEl) clueEl.classList.add("active");
    }
    const selInput = inputs[key(selected.r, selected.c)];
    if (selInput) selInput.parentElement.classList.add("active-cell");
  }

  function selectCell(r, c, preferDir) {
    const k = key(r, c);
    if (!inputs[k]) return;
    selected = { r, c };
    const ce = cellEntries[k];
    if (preferDir && ce[preferDir] !== null && ce[preferDir] !== undefined) {
      direction = preferDir;
    } else if (ce[direction] === null || ce[direction] === undefined) {
      direction = ce.across !== null && ce.across !== undefined ? "across" : "down";
    }
    highlight();
    inputs[k].focus();
  }

  function moveInWord(delta) {
    if (!selected) return;
    const entry = entryFor(selected.r, selected.c, direction);
    if (!entry) return;
    const dr = entry.direction === "down" ? 1 : 0;
    const dc = entry.direction === "across" ? 1 : 0;
    const offset = (selected.r - entry.row) * (dr || 0) + (selected.c - entry.col) * (dc || 0);
    const nextOffset = offset + delta;
    if (nextOffset < 0 || nextOffset >= entry.length) return;
    selectCell(entry.row + dr * nextOffset, entry.col + dc * nextOffset, direction);
  }

  function moveSpatial(dr, dc) {
    let r = selected.r + dr, c = selected.c + dc;
    while (r >= 0 && r < height && c >= 0 && c < width) {
      if (inputs[key(r, c)]) {
        const newDir = dc !== 0 ? "across" : "down";
        selectCell(r, c, newDir);
        return;
      }
      r += dr; c += dc;
    }
  }

  Object.keys(inputs).forEach(k => {
    const input = inputs[k];
    const [r, c] = k.split(",").map(Number);

    input.addEventListener("focus", () => {
      selected = { r, c };
      highlight();
    });

    input.addEventListener("click", () => {
      if (selected && selected.r === r && selected.c === c) {
        const ce = cellEntries[k];
        if (ce.across !== null && ce.across !== undefined && ce.down !== null && ce.down !== undefined) {
          direction = direction === "across" ? "down" : "across";
        }
      }
      selectCell(r, c);
    });

    input.addEventListener("input", () => {
      selected = { r, c };
      let v = input.value.toUpperCase().replace(/[^A-Z]/g, "");
      input.value = v.slice(-1);
      input.classList.remove("correct", "incorrect", "revealed");
      if (input.value) moveInWord(1);
      const ce = cellEntries[k];
      if (ce.across !== null && ce.across !== undefined) checkEntryByIndex(ce.across);
      if (ce.down !== null && ce.down !== undefined) checkEntryByIndex(ce.down);
      saveProgress();
    });

    input.addEventListener("keydown", (ev) => {
      if (ev.key === "Backspace" && !input.value) {
        moveInWord(-1);
        if (selected) {
          const prevInput = inputs[key(selected.r, selected.c)];
          if (!prevInput.readOnly) prevInput.value = "";
        }
        ev.preventDefault();
      } else if (ev.key === "ArrowRight") { moveSpatial(0, 1); ev.preventDefault(); }
      else if (ev.key === "ArrowLeft") { moveSpatial(0, -1); ev.preventDefault(); }
      else if (ev.key === "ArrowDown") { moveSpatial(1, 0); ev.preventDefault(); }
      else if (ev.key === "ArrowUp") { moveSpatial(-1, 0); ev.preventDefault(); }
      else if (ev.key === "Enter") { runCheck(); ev.preventDefault(); }
    });
  });

  function buildClueList(dir, containerId) {
    const container = document.getElementById(containerId);
    entries.filter(e => e.direction === dir).forEach(e => {
      const li = document.createElement("li");
      li.className = "clue-item";
      li.dataset.dir = dir;
      li.dataset.num = e.number;
      const n = document.createElement("span");
      n.className = "n";
      n.textContent = e.number + ".";
      li.appendChild(n);
      const t = document.createElement("span");
      t.textContent = e.clue;
      li.appendChild(t);
      if (e.rationale) {
        const rationale = document.createElement("span");
        rationale.className = "clue-rationale";
        rationale.hidden = true;
        const label = document.createElement("strong");
        label.textContent = "Clinical pearl: ";
        rationale.append(label, document.createTextNode(e.rationale));
        li.appendChild(rationale);
      }
      li.addEventListener("click", () => selectCell(e.row, e.col, e.direction));
      container.appendChild(li);
    });
  }
  buildClueList("across", "acrossList");
  buildClueList("down", "downList");
  restoreProgress();

  const totalCells = Object.keys(inputs).length;

  function showCelebration() {
    document.getElementById("celebrate").hidden = false;
  }
  document.getElementById("celebrateClose").addEventListener("click", () => {
    document.getElementById("celebrate").hidden = true;
  });
  document.getElementById("celebrate").addEventListener("click", (ev) => {
    if (ev.target.id === "celebrate") document.getElementById("celebrate").hidden = true;
  });

  function buildAttemptsSummary() {
    const totalAttempts = entryAttempts.reduce((a, b) => a + b, 0);
    const firstTry = entryAttempts.filter(a => a === 1).length;
    document.getElementById("celebrateSub").textContent =
      "Solved in " + totalAttempts + (totalAttempts === 1 ? " try" : " tries") +
      " across " + entries.length + " words — " + firstTry + " nailed on the first try.";

    const list = document.getElementById("celebrateAttempts");
    list.innerHTML = "";
    const pearl = entries
      .map((entry, idx) => ({ entry, attempts: entryAttempts[idx] }))
      .filter(({ entry }) => entry.rationale)
      .sort((a, b) => b.attempts - a.attempts || a.entry.number - b.entry.number)[0];
    const pearlEl = document.getElementById("completionPearl");
    if (pearl) {
      pearlEl.hidden = false;
      pearlEl.replaceChildren();
      const label = document.createElement("strong");
      label.textContent = "Today's clinical pearl — ";
      pearlEl.append(label, document.createTextNode(pearl.entry.rationale));
    } else {
      pearlEl.hidden = true;
    }
    entries
      .map((e, idx) => ({ e, attempts: entryAttempts[idx] }))
      .sort((a, b) => a.e.number - b.e.number || a.e.direction.localeCompare(b.e.direction))
      .forEach(({ e, attempts }) => {
        const row = document.createElement("div");
        row.className = "attempt-row";
        const label = document.createElement("span");
        label.className = "attempt-label";
        label.textContent = e.number + (e.direction === "across" ? "A" : "D");
        const word = document.createElement("span");
        word.className = "attempt-word";
        word.textContent = e.answer;
        const count = document.createElement("span");
        count.className = "attempt-count" + (attempts === 1 ? " first-try" : "");
        count.textContent = attempts + (attempts === 1 ? " try" : " tries");
        row.append(label, word, count);
        list.appendChild(row);
      });
  }

  function maybeCelebrate() {
    if (hasCelebrated) return;
    if (entries.every((_, idx) => entrySolved[idx])) {
      hasCelebrated = true;
      buildAttemptsSummary();
      playCompletionSounds();
      showCelebration();
      saveProgress();
    }
  }

  function revealRationale(entry) {
    const clueEl = document.querySelector(
      '.clue-item[data-dir="' + entry.direction + '"][data-num="' + entry.number + '"]'
    );
    const rationaleEl = clueEl && clueEl.querySelector(".clue-rationale");
    if (rationaleEl) rationaleEl.hidden = false;
  }

  function checkEntryByIndex(idx) {
    if (entrySolved[idx]) return;
    const entry = entries[idx];
    const dr = entry.direction === "down" ? 1 : 0;
    const dc = entry.direction === "across" ? 1 : 0;
    const entryCells = [];
    for (let i = 0; i < entry.length; i++) {
      const r = entry.row + dr * i, c = entry.col + dc * i;
      const inp = inputs[key(r, c)];
      if (!inp.value) return; // not fully filled yet
      entryCells.push({ inp, r, c });
    }
    entryAttempts[idx]++;
    let allCorrect = true;
    entryCells.forEach(({ inp, r, c }) => {
      if (inp.value === cells[r][c]) {
        inp.classList.add("correct");
        inp.classList.remove("incorrect");
      } else {
        inp.classList.add("incorrect");
        inp.classList.remove("correct");
        allCorrect = false;
      }
    });
    if (allCorrect) {
      lockEntry(idx);
      recordStudyOutcome(entry, entryAttempts[idx]);
      playEffect("correct");
      maybeCelebrate();
    } else {
      playEffect("incorrect");
    }
    saveProgress();
  }

  function runCheck() {
    entries.forEach((_, idx) => checkEntryByIndex(idx));
    let filled = 0, correct = 0;
    Object.keys(inputs).forEach(k => {
      const input = inputs[k];
      const [r, c] = k.split(",").map(Number);
      if (!input.value) return;
      filled++;
      if (input.value === cells[r][c]) correct++;
    });
    const feedback = document.getElementById("feedback");
    feedback.textContent = filled === 0
      ? "Fill in a few letters, then press Enter."
      : correct + " / " + filled + " filled cells correct.";
    maybeCelebrate();
  }

  document.getElementById("checkBtn").addEventListener("click", runCheck);

  document.getElementById("revealBtn").addEventListener("click", () => {
    entries.forEach((e, idx) => { entrySolved[idx] = true; });
    Object.keys(inputs).forEach(k => {
      const input = inputs[k];
      const [r, c] = k.split(",").map(Number);
      input.value = cells[r][c];
      input.classList.remove("correct", "incorrect");
      input.classList.add("revealed");
      input.readOnly = true;
    });
    hasCelebrated = true; // revealing isn't solving it — don't pop the celebration
    document.getElementById("feedback").textContent = "Answers revealed.";
    saveProgress();
  });
</script>
